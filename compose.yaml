services:
  postgres:
    image: postgres:17-alpine
    container_name: carry-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carry_os
      POSTGRES_USER: carry_dev
      POSTGRES_PASSWORD: carry_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carry-os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carry_dev -d carry_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carry-os-postgres-data:
